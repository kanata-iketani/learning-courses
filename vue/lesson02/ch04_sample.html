<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>入力部品の見本</title>
</head>
<body>
  <h1>アンケート(見本)</h1>

  <p>お名前: <input placeholder="山田はなこ"></p>

  <p>好きな季節:
    <select>
      <option>春</option>
      <option>夏</option>
      <option>秋</option>
      <option>冬</option>
    </select>
  </p>

  <p>ひとことメッセージ:</p>
  <p><textarea rows="4" cols="40" placeholder="複数行の文章が書けます"></textarea></p>

  <p><button>送信する</button>(今はまだ押しても何も起きません)</p>
</body>
</html>
