<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>思い出アルバム</title>
</head>
<body>
  <h1>思い出アルバム</h1>
  <p>ここに img タグを並べて、alt に思い出の説明を書きましょう。</p>
  <!-- 工夫した点: alt は「何の写真か」が言葉だけで伝わる説明文にします -->
  <p><img src="photo1.png" alt="夕日にそまる海辺で撮った家族写真"></p>
  <p><img src="photo2.png" alt="誕生日ケーキのろうそくを吹き消す妹"></p>
  <p><img src="photo3.png" alt="初雪の日に作った小さな雪だるま"></p>
</body>
</html>
