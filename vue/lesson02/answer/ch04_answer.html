<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>プロフィール登録</title>
</head>
<body>
  <h1>プロフィール登録</h1>
  <!-- 工夫した点: placeholder を付けると、入力欄に薄い字で記入例を出せます -->
  <p>ニックネーム: <input placeholder="はなちゃん"></p>
  <p>すきな飲み物:
    <select>
      <option>コーヒー</option>
      <option>紅茶</option>
      <option>ジュース</option>
    </select>
  </p>
  <p>自己紹介文:</p>
  <!-- 工夫した点: rows と cols で textarea のおおよその大きさを決められます -->
  <p><textarea rows="4" cols="40" placeholder="自由に書いてください"></textarea></p>
  <p><button>登録する</button></p>
</body>
</html>
