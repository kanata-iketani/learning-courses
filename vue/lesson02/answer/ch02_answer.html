<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おすすめ紹介</title>
</head>
<body>
  <h1>わたしのおすすめ</h1>
  <!-- 工夫した点: href の "#matome" は、id="matome" を付けた要素への飛び先指定です -->
  <p><a href="#matome">→ まとめへジャンプ</a></p>

  <h2>好きなもの(番号なしリストにする)</h2>
  <ul>
    <li>コーヒー</li>
    <li>読書</li>
    <li>サイクリング</li>
  </ul>

  <h2>おすすめの理由ベスト3(番号付きリストにする)</h2>
  <!-- 工夫した点: ol は書いた順に 1. 2. 3. と自動で番号が付きます -->
  <ol>
    <li>気分てんかんになる</li>
    <li>お金がかからない</li>
    <li>健康にもよい</li>
  </ol>

  <h2 id="matome">まとめ</h2>
  <p>この見出しに id を付けて、上のリンクから飛べるようにしましょう。</p>
</body>
</html>
