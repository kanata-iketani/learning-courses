<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>今週のまとめ</title>
</head>
<body>
  <h1>今週のまとめ</h1>

  <!-- 工夫した点: 話題ごとに div で囲み、背景色を変えて範囲を見えるようにしました -->
  <div style="background-color: lightyellow;">
    <h2>うれしかったこと</h2>
    <p>友だちと <span style="color: red;">おいしいパンケーキ</span> を食べました。</p>
  </div>

  <div style="background-color: lightcyan;">
    <h2>がんばりたいこと</h2>
    <p>毎日すこしずつ HTML の勉強を続けます。</p>
  </div>
</body>
</html>
