<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>div と span</title>
</head>
<body>
  <h1>お知らせボード</h1>

  <div style="background-color: lightyellow;">
    <h2>今日のお知らせ</h2>
    <p>この黄色い範囲がひとつの div(箱)です。</p>
    <p>見出しと段落がまとめて 1 つの箱に入っています。</p>
  </div>

  <div style="background-color: lightcyan;">
    <h2>明日の予定</h2>
    <p>ここは別の div です。<span style="color: red;">この赤い部分だけが span</span> で、行の中の一部だけを包んでいます。</p>
  </div>
</body>
</html>
