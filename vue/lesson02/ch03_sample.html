<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>画像と代替テキスト</title>
</head>
<body>
  <h1>ペット写真館(画像なし体験版)</h1>
  <p>この画面には画像ファイルが無いため、img の場所には alt の説明文が表示されます。</p>

  <h2>alt を書いた img</h2>
  <p><img src="cat.png" alt="毛づくろいをする白い猫"></p>
  <p><img src="dog.png" alt="ボールをくわえた柴犬"></p>

  <h2>alt を書き忘れた img</h2>
  <p><img src="bird.png" alt=""></p>
  <p>↑ alt が空だと何の画像だったのか全く分かりません。alt の大切さが分かります。</p>
</body>
</html>
