<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>リストとリンク</title>
</head>
<body>
  <h1>カレーの作り方</h1>
  <p><a href="#point">→ 先においしく作るコツを見る</a></p>

  <h2>材料(番号なしリスト)</h2>
  <ul>
    <li>じゃがいも</li>
    <li>にんじん</li>
    <li>カレールー</li>
  </ul>

  <h2>手順(番号付きリスト)</h2>
  <ol>
    <li>野菜を切る</li>
    <li>いためて煮こむ</li>
    <li>ルーを入れて完成</li>
  </ol>

  <h2 id="point">おいしく作るコツ</h2>
  <p>ひと晩ねかせると味がなじみます。上のリンクを押すと、ここへ飛んできます。</p>
</body>
</html>
