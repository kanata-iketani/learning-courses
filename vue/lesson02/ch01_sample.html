<body>
  <h1>わたしの旅行記</h1>
  <p>見出しの大きさのちがいに注目してください。</p>

  <h2>1日目: 出発</h2>
  <p>朝早く家を出ました。<br>電車の窓から海が見えて、わくわくしました。</p>

  <h2>2日目: 観光</h2>
  <h3>午前の予定</h3>
  <p>古いお城を見学しました。</p>
  <h3>午後の予定</h3>
  <p>名物のラーメンを食べました。<br>スープまで飲みほしました。</p>
