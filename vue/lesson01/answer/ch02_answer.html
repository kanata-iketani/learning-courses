<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>タグの練習</title>
</head>
<body>
  <h1>タグの練習</h1>
  <!-- 工夫した点: 飾りたい言葉だけをタグではさむと、文の一部だけ見た目が変わります -->
  <p>この文の中の <strong>重要</strong> という言葉を太字にしましょう。</p>
  <p>この文の <mark>どこか</mark> を蛍光ペン風に光らせましょう。</p>
  <!-- 工夫した点: 入れ子は内側の em を先に閉じてから、外側の strong を閉じます -->
  <p>この文のどこかに <strong>太字と <em>斜体</em> の入れ子</strong> を作りましょう。</p>
</body>
</html>
