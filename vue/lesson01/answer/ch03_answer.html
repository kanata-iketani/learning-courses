<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>console.log の練習</title>
</head>
<body>
  <h1>console.log の練習</h1>
  <p>出力はこの画面ではなく、開発者ツールの Console タブに表示されます。</p>

  <script>
    // 工夫した点: 文字列は " で囲みます
    console.log("プログラミングの第一歩です！");
    // 工夫した点: 計算式は囲まずに書くと、結果の数値が表示されます
    console.log(7 * 6);
    // 工夫した点: , で区切ると説明の文字列と値を並べて表示できます
    console.log("10 たす 20 は", 10 + 20);
  </script>
</body>
</html>
