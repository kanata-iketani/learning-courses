<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>よく使うタグの見本市</title>
</head>
<body>
  <h1>よく使うタグの見本市</h1>
  <p>ここは <strong>strong タグ</strong> で太字になります。</p>
  <p>ここは <em>em タグ</em> で斜体になります。</p>
  <p>ここは <mark>mark タグ</mark> で蛍光ペンのように光ります。</p>
  <p><small>ここは small タグで少し小さい文字になります。</small></p>
  <hr>
  <p>入れ子の例: <strong>太字の中に <em>斜体</em> を入れる</strong>こともできます。</p>
  <p>hr タグ(上の横線)のように、中身を持たないタグもあります。</p>
</body>
</html>
