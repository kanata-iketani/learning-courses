<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>コンソールをのぞいてみよう</title>
<style>
  body { background-color: #f0f8ff; }
  h1 { color: steelblue; }
</style>
</head>
<body>
  <h1>コンソールをのぞいてみよう</h1>
  <p><strong>F12 キー(Mac は Command + Option + I)</strong>で開発者ツールを開き、Console タブを見てください。</p>
  <p>このページの script は、画面ではなくコンソールに 3 行のメッセージを出しています。</p>

  <script>
    console.log("ようこそ、コンソールへ！");
    console.log("計算もできます:", 10 + 20);
    console.log("ここが JavaScript の作業場です");
  </script>
</body>
</html>
