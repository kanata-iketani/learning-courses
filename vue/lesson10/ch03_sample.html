<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>マスタッシュ構文</title>
<script src="/vendor/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <h1>{{ shopName }}</h1>
    <p>商品名: {{ item }}({{ item.length }} 文字)</p>
    <p>単価: {{ price }} 円 × {{ count }} 個</p>
    <!-- {{ }} の中では計算もできる -->
    <p>合計: {{ price * count }} 円</p>
    <!-- 三項演算子(条件 ? 真のとき : 偽のとき)も式なので書ける -->
    <p>在庫: {{ stock > 0 ? "あり(残り" + stock + "個)" : "売り切れ" }}</p>
  </div>

  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          shopName: "Vue 商店",
          item: "りんごジュース",
          price: 120,
          count: 3,
          stock: 5
        };
      }
    }).mount("#app");
  </script>
</body>
</html>
