<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>class の使い分け</title>
<style>
  p          { color: dimgray; }
  .important { color: red; font-weight: bold; }
  .memo      { background-color: lightyellow; }
</style>
</head>
<body>
  <h1>今日の連絡</h1>
  <p>ここはふつうの段落なので、p セレクタの灰色です。</p>
  <p class="important">ここは class="important" なので赤い太字です。</p>
  <p class="memo">ここは class="memo" なので黄色いメモ風です。</p>
  <p class="important">同じ class を付ければ、この段落も同じ赤い太字になります。</p>
</body>
</html>
