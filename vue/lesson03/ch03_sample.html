<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>margin と padding</title>
<style>
  div { border: 2px solid tomato; background-color: lightyellow; }
  .m  { margin: 30px; }
  .p  { padding: 30px; }
</style>
</head>
<body>
  <h1>margin と padding のちがい</h1>
  <div>余白なしの箱。枠線と文字がくっついています。</div>
  <div class="m">margin: 30px の箱。枠線の外側に空間ができて、箱ごと内側に寄ります。</div>
  <div class="p">padding: 30px の箱。枠線の内側に空間ができて、文字が枠から離れます。</div>
  <div>ふつうの箱に戻ると、上の箱との間隔のちがいがよく分かります。</div>
</body>
</html>
