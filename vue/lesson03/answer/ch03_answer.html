<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>お知らせカード</title>
<style>
  /* 工夫した点: padding で文字を枠から離し、margin でカードの間隔を空けました。
     .card にまとめて書けば 3 枚全部に同じ余白が付きます */
  .card {
    border: 2px solid steelblue;
    background-color: aliceblue;
    padding: 16px;
    margin: 12px;
  }
</style>
</head>
<body>
  <h1>お知らせ</h1>
  <div class="card">4月1日: 新しい講座が始まります。</div>
  <div class="card">4月8日: 質問会をオンラインで開きます。</div>
  <div class="card">4月15日: 演習のふりかえり会があります。</div>
</body>
</html>
