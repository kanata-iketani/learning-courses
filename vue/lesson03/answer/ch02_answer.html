<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>本日のセール</title>
<style>
  /* 工夫した点: タイトルは大きく中央ぞろえにして一番目立たせます */
  h1 { font-size: 48px; text-align: center; color: crimson; }
  /* 工夫した点: 値段は太字 + 大きめで 2 番目に目立たせます */
  .price { font-size: 28px; font-weight: bold; text-align: center; }
  /* 工夫した点: 注意書きは小さくして、じゃまにならないようにします */
  .note { font-size: 12px; text-align: center; color: gray; }
</style>
</head>
<body>
  <h1>本日のセール</h1>
  <p class="price">りんご 1袋 100円</p>
  <p class="note">※ お一人さま 3袋までとさせていただきます。</p>
</body>
</html>
