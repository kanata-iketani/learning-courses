<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>配色の練習</title>
<style>
  /* 工夫した点: 背景はうすい色にすると文字が読みやすいままです */
  body { background-color: lavender; }
  /* 工夫した点: 文字色と背景色をセットで指定すると見出しが目立ちます */
  h1   { color: white; background-color: darkslateblue; }
  /* 工夫した点: カラーコードなら色名にない微妙な色も作れます */
  p    { color: #cc3366; }
</style>
</head>
<body>
  <h1>配色の練習</h1>
  <p>style の中だけを書きかえて、このページの色を変えましょう。</p>
  <p>同じセレクタの指定は、同じタグ全部にまとめて効きます。</p>
</body>
</html>
