<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>色で遊ぼう</title>
<style>
  body { background-color: lightyellow; }
  h1   { color: white; background-color: steelblue; }
  h2   { color: seagreen; }
  p    { color: #ff6600; }
</style>
</head>
<body>
  <h1>色で遊ぼう</h1>
  <h2>セレクタは「飾る相手」の指定です</h2>
  <p>この段落は p セレクタの指定でオレンジ色(#ff6600)になっています。</p>
  <p>同じ p タグなので、この段落にも同じ色が自動で付きます。</p>
</body>
</html>
