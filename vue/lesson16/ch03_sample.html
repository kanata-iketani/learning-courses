<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TODOアプリ(完成版)</title>
<style>.done { text-decoration: line-through; color: #999; }</style>
</head>
<body>
  <div id="app">
    <h1>TODOリスト(残り {{ remaining }} 件)</h1>
    <input v-model="newText" placeholder="やることを入力">
    <button v-on:click="addTodo">追加</button>
    <ul>
      <li v-for="todo in todos" :key="todo.id">
        <input type="checkbox" v-model="todo.done"> <span :class="{ done: todo.done }">{{ todo.text }}</span>
        <button v-on:click="removeTodo(todo.id)">削除</button>
      </li>
    </ul>
  </div>
  <script src="/vendor/vue.global.prod.js"></script>
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          newText: "", nextId: 3,
          todos: [{ id: 1, text: "牛乳を買う", done: false },
                  { id: 2, text: "部屋のそうじ", done: false }]
        };
      },
      computed: {
        remaining() { return this.todos.filter(todo => !todo.done).length; }
      },
      methods: {
        addTodo() {
          if (this.newText.trim() === "") return;
          this.todos.push({ id: this.nextId, text: this.newText, done: false });
          this.nextId++; this.newText = "";
        },
        removeTodo(id) { this.todos = this.todos.filter(todo => todo.id !== id); }
      }
    }).mount("#app");
  </script>
</body>
</html>
